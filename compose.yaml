services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: no
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:lts
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laporan_harian
      MYSQL_USER: ahmad
      MYSQL_PASSWORD: ahmad
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
